global:
  guess_columns: true
  lattice_mode: false
  stream_mode: true

files:
  - filename: "multipage.pdf"
    overrides:
      # Start extraction at "No. Description"
      startMarker: "No. Description"
      # End extraction at "Payment Terms"
      endMarker: "Payment Terms"
      # Use left/right limits from area, but dynamic top/bottom
      # Top/Bottom here act as fallbacks or limits if markers not found
      area: [0.0, 20.0, 800.0, 580.0]
